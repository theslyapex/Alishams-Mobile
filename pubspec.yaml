name: alishams_mobile
description: ALISHAMS Mobile
publish_to: 'none'
version: 1.0.4+5
environment:
  sdk: ^3.12.2
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  supabase_flutter: ^2.8.4
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter_local_notifications: ^19.4.2
  go_router: ^14.6.2
  google_fonts: ^6.2.1
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_svg: ^2.0.17
  lottie: ^3.7.0
  image_picker: ^1.1.2
  image_cropper: ^13.0.0
  file_picker: ^13.3.2
  url_launcher: ^6.3.3
  video_player: ^2.10.0
  youtube_player_flutter: ^9.1.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  fonts:
    - family: Estedad
      fonts:
        - asset: assets/fonts/Estedad[wght].ttf
          weight: 100
          # Variable font; Flutter uses this file for the full weight range.
  assets:
    - assets/icons/
    - assets/images/branding/
    - assets/images/
    - assets/images/site/
    - assets/animations/
    - assets/
