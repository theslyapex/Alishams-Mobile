name: alishams_mobile
description: ALISHAMS Mobile
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: ^3.12.2
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  supabase_flutter: ^2.8.4
  go_router: ^14.6.2
  google_fonts: ^6.2.1
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_svg: ^2.0.17
  lottie: ^3.7.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/branding/
    - assets/images/site/
    - assets/images/sourced/home/
    - assets/images/sourced/auth/
    - assets/animations/
    - assets/
